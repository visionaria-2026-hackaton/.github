<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t d">
  <title id="t">Hackathon Visionaria 2026</title>
  <desc id="d">Smart Slow Travel. 25-27 novembre 2026, Porto Turistico Marina di Pescara.</desc>
  <style>
    .f { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .h { font-weight: 800; letter-spacing: -2px; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .ring  { animation: ring 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    .spin  { animation: spin 18s linear infinite; transform-origin: center; transform-box: fill-box; }
    .float { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 7s ease-in-out infinite reverse; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @keyframes ring  { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1280" height="460" rx="28" fill="#1e1e1e"/>

  <!-- brand shapes -->
  <g class="float"><rect x="-40" y="-40" width="230" height="110" rx="34" fill="#9be22d"/></g>
  <g class="float2"><path d="M1060 26 h200 a32 32 0 0 1 32 32" fill="none" stroke="#3fc1e8" stroke-width="26" stroke-linecap="round"/></g>
  <circle cx="20" cy="400" r="70" fill="none" stroke="#e8457f" stroke-width="18"/>
  <g transform="translate(1210 205) scale(0.62) translate(-1194 -268)"><g class="spin">
    <path d="M1180 250 l14 -46 l14 46 l46 -14 l-36 32 l36 32 l-46 -14 l-14 46 l-14 -46 l-46 14 l36 -32 l-36 -32 z" fill="#8b5cf6"/>
  </g></g>
  <g class="float"><circle cx="1040" cy="500" r="110" fill="#e3201b"/></g>
  <path d="M520 470 a46 46 0 0 1 0 -80 M640 470 a46 46 0 0 0 0 -80" fill="none" stroke="#f6b81c" stroke-width="16" stroke-linecap="round"/>
  <circle cx="580" cy="452" r="22" fill="#f6b81c"/>

  <!-- kicker -->
  <text x="96" y="122" class="f" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="6">VISIONARIA 2026 · HACKATHON</text>

  <!-- headline -->
  <text x="90" y="222" class="f h" font-size="104" fill="#ffffff">Sl<tspan fill="#1e1e1e">o</tspan>w down.</text>
  <circle class="ring"  cx="215" cy="187" r="25" fill="none" stroke="#e3201b" stroke-width="5"/>
  <circle class="pulse" cx="215" cy="187" r="25" fill="#e3201b"/>
  <text x="90" y="324" class="f h" font-size="104" fill="#ffffff">Build fast<tspan fill="#e3201b" class="blink">_</tspan></text>

  <!-- tags -->
  <text x="96" y="384" class="f" font-size="26" font-weight="600">
    <tspan fill="#9be22d">Smart</tspan><tspan fill="#666"> | </tspan><tspan fill="#3fc1e8">Slow</tspan><tspan fill="#666"> | </tspan><tspan fill="#f6b81c">Travel</tspan><tspan fill="#666"> | </tspan><tspan fill="#b48cff">AI</tspan>
  </text>

  <!-- right column -->
  <line x1="800" y1="150" x2="800" y2="360" stroke="#e3201b" stroke-width="3"/>
  <text x="836" y="198" class="f h" font-size="52" fill="#ffffff" letter-spacing="-1">25–27</text>
  <text x="836" y="252" class="f h" font-size="44" fill="#ffffff" letter-spacing="-1">Novembre 2026</text>
  <text x="836" y="306" class="f" font-size="24" font-weight="700" fill="#ffffff">Padiglione D. Becci</text>
  <text x="836" y="340" class="f" font-size="22" fill="#cfcfcf">Marina di Pescara</text>
</svg>
